[package]
name = "codecsls"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Lossless image codecs in safe Rust: JPEG-LS (ITU-T T.87), gray and colour"
repository = "https://github.com/Aegyptiacus11/codecsls-rs"
keywords = ["jpeg-ls", "jpegls", "dicom", "lossless", "codec"]
categories = ["compression", "multimedia::images"]
exclude = ["bench/"]

[dev-dependencies]
# The reference implementation, C++ built by cmake: what the tests compare with.
charls = { version = "=0.4.2", features = ["static"] }
