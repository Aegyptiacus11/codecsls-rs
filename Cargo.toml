[package]
name = "codecsls"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Lossless image codecs in safe Rust: JPEG-LS (ITU-T T.87), gray and colour"
repository = "https://github.com/Aegyptiacus11/codecsls-rs"
keywords = ["jpeg-ls", "jpegls", "dicom", "lossless", "codec"]
categories = ["compression", "multimedia::images"]
exclude = ["bench/", "charls-ref/"]

[dev-dependencies]
# CharLS, the reference implementation, built from the release the submodule pins: what
# the tests compare with. C++, so the tests need cmake and a compiler.
charls-ref = { path = "charls-ref" }
