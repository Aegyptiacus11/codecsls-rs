[package]
name = "jpegls"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "JPEG-LS (ITU-T T.87) for single-component images: lossless encoder, lossless and near-lossless decoder, in safe Rust"
repository = "https://github.com/Aegyptiacus11/jpegls-rs"
keywords = ["jpeg-ls", "jpegls", "dicom", "lossless", "codec"]
categories = ["compression", "multimedia::images"]
exclude = ["bench/"]

[dev-dependencies]
# The reference implementation, C++ built by cmake: what the tests compare with.
charls = { version = "=0.4.2", features = ["static"] }
