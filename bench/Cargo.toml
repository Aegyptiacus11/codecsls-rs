# Compares this crate with CharLS and the other pure-Rust JPEG-LS codecs on a folder of
# DICOM slices. A package of its own, so the crate itself depends on nothing.
[package]
name = "codecsls-bench"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
codecsls = { path = ".." }
charls-ref = { path = "../charls-ref" }
pure_jpegls = { package = "pure_jpegls", version = "=2.1.0" }
dicom-toolkit-codec = "=0.5.0"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
